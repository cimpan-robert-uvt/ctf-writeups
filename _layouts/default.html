<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}

{% seo %}
  </head>

  <body>

    <header>
      <div class="container site-header">
        <a href="https://github.com/cimpan-robert-uvt/ctf-writeups"target="_blank" rel="noopener"><img src="{{ '/assets/github-logo.png' | relative_url }}" alt="GitHub" width="50"></a>  <a id="a-title" href="{{ '/' | relative_url }}"><h1>{{ site.title | default: site.github.repository_name }}</h1></a>
        <h2>{{ site.description | default: site.github.project_tagline }}</h2>

        <section id="downloads">
          {% if site.show_downloads %}
            <a href="{{ site.github.zip_url }}" class="btn">Download as .zip</a>
            <a href="{{ site.github.tar_url }}" class="btn">Download as .tar.gz</a>
          {% endif %}
          <p><strong>Current location:    </strong><a href="https://tryhackme.com/module/cryptography-101"target="_blank" rel="noopener"><img src="{{ '/assets/thm-logo.png' | relative_url }}" alt="TryHackMe" width="30"></a></p>
        </section>
      </div>
    </header>

    <div class="container">
      <section id="main_content">
        {{ content }}
      </section>
    </div>
    <footer>
      <div class="container footer-inner">
        <a href="https://tryhackme.com/p/user.R" target="_blank" rel="noopener">
          <img src="{{ '/assets/thm-logo.png' | relative_url }}" alt="TryHackMe" width="50">
        </a>
        <a href="https://app.hackthebox.com/users/4170183" target="_blank" rel="noopener">
          <img src="{{ '/assets/htb-logo.png' | relative_url }}" alt="HackTheBox" width="50">
        </a>
        <a href="https://www.linkedin.com/in/robert-cimpan" target="_blank" rel="noopener">
          <img src="{{ '/assets/linkedin-logo.png' | relative_url }}" alt="LinkedIn" width="50">
        </a>
      </div>
    </footer>
  <script>
    function revealSpoiler(spoiler) {
      spoiler.classList.add('revealed');
      spoiler.setAttribute('aria-label', 'Revealed spoiler');
    }

    document.addEventListener('click', function (event) {
      var spoiler = event.target.closest('.spoiler');
      if (spoiler) revealSpoiler(spoiler);
    });

    document.addEventListener('keydown', function (event) {
      var spoiler = event.target.closest('.spoiler');
      if (spoiler && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        revealSpoiler(spoiler);
      }
    });

    document.addEventListener('pointermove', function (event) {
      document.documentElement.style.setProperty('--mouse-x', event.clientX + 'px');
      document.documentElement.style.setProperty('--mouse-y', event.clientY + 'px');
    });
  </script>
  </body>
</html>
