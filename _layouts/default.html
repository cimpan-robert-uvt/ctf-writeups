<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}

{% seo %}
  </head>

  <body>

    <header>
      <div class="container">
        <a id="a-title" href="{{ '/' | relative_url }}">
          <h1>{{ site.title | default: site.github.repository_name }}</h1>
        </a>
        <h2>{{ site.description | default: site.github.project_tagline }}</h2>

        <section id="downloads">
          {% if site.show_downloads %}
            <a href="{{ site.github.zip_url }}" class="btn">Download as .zip</a>
            <a href="{{ site.github.tar_url }}" class="btn">Download as .tar.gz</a>
          {% endif %}
          <a href="{{ site.github.repository_url }}" class="btn btn-github"><span class="icon"></span>View on GitHub</a>
        </section>
      </div>
    </header>

    <div class="container">
      <section id="main_content">
        {{ content }}
      </section>
    </div>
  </body>
  <footer>
    <div style="display: flex; gap: 15px; padding-top: 20px;">
  <a href="YOUR_THM_PROFILE_URL" target="_blank">
    <img src="/ctf-writeups/assets/thm-logo.png" alt="TryHackMe" width="30">
  </a>
  <a href="YOUR_HTB_PROFILE_URL" target="_blank">
    <img src="/ctf-writeups/assets/htb-logo.png" alt="HackTheBox" width="30">
  </a>
  <a href="YOUR_LINKEDIN_URL" target="_blank">
    <img src="/ctf-writeups/assets/linkedin-logo.png" alt="LinkedIn" width="30">
  </a>
</div>
  </footer>
  <script>
    document.addEventListener('pointermove', function (event) {
      document.documentElement.style.setProperty('--mouse-x', event.clientX + 'px');
      document.documentElement.style.setProperty('--mouse-y', event.clientY + 'px');
    });
  </script>
</html>
